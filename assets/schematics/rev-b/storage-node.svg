<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Separate computation from persistence.</title><desc id="desc">Durable storage is a service with error correction, state, and power requirements. “Passive” is reserved for truly passive devices; this baseline storage spacecraft is active.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  03</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Separate computation from persistence.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Durable storage is a service with error correction, state, and power requirements.</text>
    <rect x="45" y="215" width="500" height="320" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 216h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="252" fill="#dac08a" font-size="21" font-weight="500">CONTROLLER / computation &amp; orchestration</text><text x="67" y="287" fill="#a3acad" font-size="17" font-weight="400">Flight computer and job scheduling</text><text x="67" y="314" fill="#a3acad" font-size="17" font-weight="400">Hybrid photonic accelerator</text><text x="67" y="341" fill="#a3acad" font-size="17" font-weight="400">Optical terminal + RF recovery link</text><text x="67" y="368" fill="#a3acad" font-size="17" font-weight="400">Replicated metadata and command authority</text><text x="67" y="395" fill="#a3acad" font-size="17" font-weight="400">Power, thermal, attitude, and fault management</text><rect x="675" y="215" width="480" height="320" rx="10" fill="#111a1e" stroke="#344044"/><path d="M695 216h45" stroke="#dac08a" stroke-width="3"/><text x="697" y="252" fill="#dac08a" font-size="21" font-weight="500">STORAGE NODE / active, minimal compute</text><text x="697" y="287" fill="#a3acad" font-size="17" font-weight="400">Low-power MCU + authenticated commands</text><text x="697" y="314" fill="#a3acad" font-size="17" font-weight="400">ECC nonvolatile storage + data scrubbing</text><text x="697" y="341" fill="#a3acad" font-size="17" font-weight="400">Optical transceiver / pointing control</text><text x="697" y="368" fill="#a3acad" font-size="17" font-weight="400">Watchdog, power, thermal, and health telemetry</text><text x="697" y="395" fill="#a3acad" font-size="17" font-weight="400">Local safe state during controller loss</text><path d="M545 310 L675 310" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M675 425 L545 425" stroke="#8abac8" stroke-width="2" fill="none"  marker-end="url(#blue)"/><text x="556" y="289" fill="#dac08a" font-size="13" font-weight="400">WRITE</text><text x="556" y="451" fill="#8abac8" font-size="13" font-weight="400">ACK / READ</text><text x="65" y="592" fill="#dac08a" font-size="16" font-weight="500">OPTICAL MEMORY RESEARCH</text><text x="65" y="624" fill="#a3acad" font-size="17" font-weight="400">Isolated test payload: retention, read fidelity, refresh energy, and environmental tolerance must be measured.</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">“Passive” is reserved for truly passive devices; this baseline storage spacecraft is active.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>