<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Count states. Then measure information.</title><desc id="desc">Correction to the original 32-bit alphabet claim · an ideal count is not a hardware result. 256 × 64 × 16 × 256 = 67,108,864 joint labels = 2²⁶; independence is an unverified assumption.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  06</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Count states. Then measure information.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Correction to the original 32-bit alphabet claim · an ideal count is not a hardware result.</text>
    <rect x="45" y="218" width="245" height="190" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 219h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="255" fill="#dac08a" font-size="21" font-weight="500">Wavelength</text><text x="67" y="290" fill="#a3acad" font-size="17" font-weight="400">256 candidate states</text><text x="67" y="317" fill="#a3acad" font-size="17" font-weight="400">log₂(256) = 8 bits</text><text x="67" y="344" fill="#a3acad" font-size="17" font-weight="400">Channel spacing / crosstalk</text><rect x="333" y="218" width="245" height="190" rx="10" fill="#111a1e" stroke="#344044"/><path d="M353 219h45" stroke="#8abac8" stroke-width="3"/><text x="355" y="255" fill="#8abac8" font-size="21" font-weight="500">Phase</text><text x="355" y="290" fill="#a3acad" font-size="17" font-weight="400">64 candidate states</text><text x="355" y="317" fill="#a3acad" font-size="17" font-weight="400">log₂(64) = 6 bits</text><text x="355" y="344" fill="#a3acad" font-size="17" font-weight="400">Phase noise / calibration</text><rect x="622" y="218" width="245" height="190" rx="10" fill="#111a1e" stroke="#344044"/><path d="M642 219h45" stroke="#dac08a" stroke-width="3"/><text x="644" y="255" fill="#dac08a" font-size="21" font-weight="500">Polarization</text><text x="644" y="290" fill="#a3acad" font-size="17" font-weight="400">16 candidate states</text><text x="644" y="317" fill="#a3acad" font-size="17" font-weight="400">log₂(16) = 4 bits</text><text x="644" y="344" fill="#a3acad" font-size="17" font-weight="400">State separability / SNR</text><rect x="910" y="218" width="245" height="190" rx="10" fill="#111a1e" stroke="#344044"/><path d="M930 219h45" stroke="#8abac8" stroke-width="3"/><text x="932" y="255" fill="#8abac8" font-size="21" font-weight="500">Amplitude</text><text x="932" y="290" fill="#a3acad" font-size="17" font-weight="400">256 candidate states</text><text x="932" y="317" fill="#a3acad" font-size="17" font-weight="400">log₂(256) = 8 bits</text><text x="932" y="344" fill="#a3acad" font-size="17" font-weight="400">Noise / detector range</text><text x="62" y="481" fill="#dac08a" font-size="38" font-weight="500">8 + 6 + 4 + 8 = 26 bits</text><text x="62" y="523" fill="#a3acad" font-size="20" font-weight="400">Formal alphabet count only, assuming independent and distinguishable states.</text><text x="62" y="550" fill="#a3acad" font-size="20" font-weight="400">This does not establish achievable bits per photon, storage capacity, or net link throughput.</text><text x="62" y="608" fill="#dac08a" font-size="14" font-weight="400">NEXT MEASUREMENT</text><text x="62" y="641" fill="#a3acad" font-size="18" font-weight="400">Measure symbol errors and mutual information; report net rate after coding and protocol overhead.</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">256 × 64 × 16 × 256 = 67,108,864 joint labels = 2²⁶; independence is an unverified assumption.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>