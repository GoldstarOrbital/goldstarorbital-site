<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Inside the photonic building block.</title><desc id="desc">Conceptual 2 × 2 Mach–Zehnder interferometer · waveguide paths and phase control. A mesh needs further phase controls, calibration, loss modeling, and electronic I/O. Not a fabrication layout.</desc>
