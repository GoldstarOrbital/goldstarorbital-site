    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  10</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Inside the photonic building block.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Conceptual 2 × 2 Mach–Zehnder interferometer · waveguide paths and phase control.</text>
    <text x="65" y="221" fill="#8abac8" font-size="14" font-weight="400">TWO OPTICAL INPUTS</text><text x="960" y="221" fill="#8abac8" font-size="14" font-weight="400">TWO OUTPUTS</text><path d="M65 300H295 M65 410H295 M345 300C415 300 400 265 455 265H695C760 265 745 300 805 300 M345 410C415 410 400 445 455 445H695C760 445 745 410 805 410 M855 300H1125 M855 410H1125" fill="none" stroke="#dac08a" stroke-width="3"/><rect x="295" y="276" width="50" height="158" rx="12" fill="#203640" stroke="#8abac8"/><rect x="805" y="276" width="50" height="158" rx="12" fill="#203640" stroke="#8abac8"/><rect x="498" y="245" width="150" height="40" rx="6" fill="#4a4030" stroke="#dac08a"/><text x="520" y="272" fill="#dac08a" font-size="21" font-weight="400">Phase φ</text><text x="252" y="482" fill="#8abac8" font-size="18" font-weight="400">Coupler 1</text><text x="766" y="482" fill="#8abac8" font-size="18" font-weight="400">Coupler 2</text><path d="M572 565 L572 293" stroke="#8abac8" stroke-width="2" fill="none" stroke-dasharray="6 7" marker-end="url(#blue)"/><rect x="45" y="545" width="370" height="105" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 546h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="582" fill="#dac08a" font-size="21" font-weight="500">Interference sets the split</text><text x="67" y="617" fill="#a3acad" font-size="17" font-weight="400">Control amplitude mixing via phase</text><rect x="445" y="565" width="310" height="85" rx="10" fill="#111a1e" stroke="#344044"/><path d="M465 566h45" stroke="#8abac8" stroke-width="3"/><text x="467" y="602" fill="#8abac8" font-size="21" font-weight="500">Calibrated phase driver</text><rect x="795" y="545" width="360" height="105" rx="10" fill="#111a1e" stroke="#344044"/><path d="M815 546h45" stroke="#dac08a" stroke-width="3"/><text x="817" y="582" fill="#dac08a" font-size="21" font-weight="500">Tile into a mesh</text><text x="817" y="617" fill="#a3acad" font-size="17" font-weight="400">Program supported linear transforms</text><text x="65" y="337" fill="#f3f1eb" font-size="22" font-weight="400">x₁</text><text x="65" y="447" fill="#f3f1eb" font-size="22" font-weight="400">x₂</text><text x="1080" y="337" fill="#f3f1eb" font-size="22" font-weight="400">y₁</text><text x="1080" y="447" fill="#f3f1eb" font-size="22" font-weight="400">y₂</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">A mesh needs further phase controls, calibration, loss modeling, and electronic I/O. Not a fabrication layout.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>