<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Trust is designed into the protocol.</title><desc id="desc">Proposed controls · security comes from verifiable mechanisms, not a secret orbit. A threat model and implementation review are required before claiming secure operation.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  07</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Trust is designed into the protocol.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Proposed controls · security comes from verifiable mechanisms, not a secret orbit.</text>
    <rect x="45" y="220" width="290" height="165" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 221h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="257" fill="#dac08a" font-size="21" font-weight="500">AUTHORIZE</text><text x="67" y="292" fill="#a3acad" font-size="17" font-weight="400">Provision device identity</text><text x="67" y="319" fill="#a3acad" font-size="17" font-weight="400">Authenticate each command</text><text x="67" y="346" fill="#a3acad" font-size="17" font-weight="400">Enforce roles + expiry</text><rect x="455" y="220" width="290" height="165" rx="10" fill="#111a1e" stroke="#344044"/><path d="M475 221h45" stroke="#8abac8" stroke-width="3"/><text x="477" y="257" fill="#8abac8" font-size="21" font-weight="500">PROTECT</text><text x="477" y="292" fill="#a3acad" font-size="17" font-weight="400">Authenticated encryption</text><text x="477" y="319" fill="#a3acad" font-size="17" font-weight="400">Sequence / replay checks</text><text x="477" y="346" fill="#a3acad" font-size="17" font-weight="400">Bundle integrity across relays</text><rect x="865" y="220" width="290" height="165" rx="10" fill="#111a1e" stroke="#344044"/><path d="M885 221h45" stroke="#dac08a" stroke-width="3"/><text x="887" y="257" fill="#dac08a" font-size="21" font-weight="500">RECOVER</text><text x="887" y="292" fill="#a3acad" font-size="17" font-weight="400">Verified boot + signed updates</text><text x="887" y="319" fill="#a3acad" font-size="17" font-weight="400">Key rotation / revocation</text><text x="887" y="346" fill="#a3acad" font-size="17" font-weight="400">Safe-mode command path</text><path d="M335 301 L455 301" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M745 301 L865 301" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><rect x="45" y="460" width="530" height="155" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 461h45" stroke="#8abac8" stroke-width="3"/><text x="67" y="497" fill="#8abac8" font-size="21" font-weight="500">Fault-aware storage</text><text x="67" y="532" fill="#a3acad" font-size="17" font-weight="400">ECC, scrub, replicate, verify before acknowledging</text><text x="67" y="559" fill="#a3acad" font-size="17" font-weight="400">Recover metadata and keys after controller loss</text><rect x="625" y="460" width="530" height="155" rx="10" fill="#111a1e" stroke="#344044"/><path d="M645 461h45" stroke="#dac08a" stroke-width="3"/><text x="647" y="497" fill="#dac08a" font-size="21" font-weight="500">Link-aware operations</text><text x="647" y="532" fill="#a3acad" font-size="17" font-weight="400">Pointing and narrow beams reduce exposure</text><text x="647" y="559" fill="#a3acad" font-size="17" font-weight="400">They do not replace cryptography or availability planning</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">A threat model and implementation review are required before claiming secure operation.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>