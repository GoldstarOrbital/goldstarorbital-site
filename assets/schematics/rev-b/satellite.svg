    </g><rect x="45" y="195" width="310" height="157" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 196h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="232" fill="#dac08a" font-size="21" font-weight="500">01 / Power &amp; survival</text><text x="67" y="267" fill="#a3acad" font-size="17" font-weight="400">Solar + battery for a LEO test</text><text x="67" y="294" fill="#a3acad" font-size="17" font-weight="400">Power source traded per mission</text><text x="67" y="321" fill="#a3acad" font-size="17" font-weight="400">Independent safe-mode rail</text><rect x="45" y="415" width="310" height="187" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 416h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="452" fill="#dac08a" font-size="21" font-weight="500">02 / Thermal path</text><text x="67" y="487" fill="#a3acad" font-size="17" font-weight="400">Payload → spreader → radiator</text><text x="67" y="514" fill="#a3acad" font-size="17" font-weight="400">MLI limits unwanted heat flow</text><text x="67" y="541" fill="#a3acad" font-size="17" font-weight="400">Sensors close the control loop</text><text x="67" y="568" fill="#a3acad" font-size="17" font-weight="400">Radiator area requires a budget</text><rect x="845" y="195" width="310" height="157" rx="10" fill="#111a1e" stroke="#344044"/><path d="M865 196h45" stroke="#dac08a" stroke-width="3"/><text x="867" y="232" fill="#dac08a" font-size="21" font-weight="500">03 / Navigation</text><text x="867" y="267" fill="#a3acad" font-size="17" font-weight="400">Star tracker + reaction wheels</text><text x="867" y="294" fill="#a3acad" font-size="17" font-weight="400">Fine optical pointing stage</text><text x="867" y="321" fill="#a3acad" font-size="17" font-weight="400">RF recovery / command link</text><rect x="845" y="415" width="310" height="187" rx="10" fill="#111a1e" stroke="#344044"/><path d="M865 416h45" stroke="#dac08a" stroke-width="3"/><text x="867" y="452" fill="#dac08a" font-size="21" font-weight="500">04 / Experiment deck</text><text x="867" y="487" fill="#a3acad" font-size="17" font-weight="400">Photonic accelerator + electronics</text><text x="867" y="514" fill="#a3acad" font-size="17" font-weight="400">ECC storage + flight computer</text><text x="867" y="541" fill="#a3acad" font-size="17" font-weight="400">Isolated optical-terminal mount</text><text x="867" y="568" fill="#a3acad" font-size="17" font-weight="400">Radiation / vibration qualification</text><path d="M355 275 L462 310" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M355 475 L493 422" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M845 275 L685 284" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M845 480 L685 405" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">Add a testable flight bus before scaling a constellation. Hardware geometry is illustrative.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>