<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">A spacecraft around the experiment.</title><desc id="desc">Functional layout · solar demonstrator shown; deep-space power remains a trade. Add a testable flight bus before scaling a constellation. Hardware geometry is illustrative.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  01</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">A spacecraft around the experiment.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Functional layout · solar demonstrator shown; deep-space power remains a trade.</text>
