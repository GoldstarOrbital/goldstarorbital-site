<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Light does the matrix work.</title><desc id="desc">Hybrid accelerator · electronic memory, conversion, control, and validation remain explicit. MZI = Mach–Zehnder interferometer · TIA = transimpedance amplifier · DAC / ADC = data converters.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  02</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Light does the matrix work.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Hybrid accelerator · electronic memory, conversion, control, and validation remain explicit.</text>
    <rect x="45" y="218" width="255" height="140" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 219h45" stroke="#8abac8" stroke-width="3"/><text x="67" y="255" fill="#8abac8" font-size="21" font-weight="500">Electronic input</text><text x="67" y="290" fill="#a3acad" font-size="17" font-weight="400">ECC memory / DMA</text><text x="67" y="317" fill="#a3acad" font-size="17" font-weight="400">Scheduler + digital logic</text><rect x="360" y="218" width="240" height="140" rx="10" fill="#111a1e" stroke="#344044"/><path d="M380 219h45" stroke="#dac08a" stroke-width="3"/><text x="382" y="255" fill="#dac08a" font-size="21" font-weight="500">Optical preparation</text><text x="382" y="290" fill="#a3acad" font-size="17" font-weight="400">DAC + modulator drivers</text><text x="382" y="317" fill="#a3acad" font-size="17" font-weight="400">Laser / wavelength control</text><rect x="660" y="218" width="220" height="140" rx="10" fill="#111a1e" stroke="#344044"/><path d="M680 219h45" stroke="#dac08a" stroke-width="3"/><text x="682" y="255" fill="#dac08a" font-size="21" font-weight="500">Photonic core</text><text x="682" y="290" fill="#a3acad" font-size="17" font-weight="400">Calibrated MZI mesh</text><text x="682" y="317" fill="#a3acad" font-size="17" font-weight="400">Matrix operations</text><rect x="940" y="218" width="215" height="140" rx="10" fill="#111a1e" stroke="#344044"/><path d="M960 219h45" stroke="#8abac8" stroke-width="3"/><text x="962" y="255" fill="#8abac8" font-size="21" font-weight="500">Readout</text><text x="962" y="290" fill="#a3acad" font-size="17" font-weight="400">Detector + TIA</text><text x="962" y="317" fill="#a3acad" font-size="17" font-weight="400">ADC + validation</text><path d="M300 286 L360 286" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M600 286 L660 286" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M880 286 L940 286" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><rect x="45" y="452" width="335" height="157" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 453h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="489" fill="#dac08a" font-size="21" font-weight="500">Control &amp; calibration</text><text x="67" y="524" fill="#a3acad" font-size="17" font-weight="400">Temperature / phase feedback</text><text x="67" y="551" fill="#a3acad" font-size="17" font-weight="400">Reference vectors + error checks</text><text x="67" y="578" fill="#a3acad" font-size="17" font-weight="400">Electronic fallback for rejected jobs</text><rect x="425" y="452" width="335" height="157" rx="10" fill="#111a1e" stroke="#344044"/><path d="M445 453h45" stroke="#8abac8" stroke-width="3"/><text x="447" y="489" fill="#8abac8" font-size="21" font-weight="500">Measure the whole system</text><text x="447" y="524" fill="#a3acad" font-size="17" font-weight="400">Laser + converters + memory</text><text x="447" y="551" fill="#a3acad" font-size="17" font-weight="400">Control + compute + cooling</text><text x="447" y="578" fill="#a3acad" font-size="17" font-weight="400">Joules per validated workload</text><rect x="805" y="452" width="350" height="157" rx="10" fill="#111a1e" stroke="#344044"/><path d="M825 453h45" stroke="#dac08a" stroke-width="3"/><text x="827" y="489" fill="#dac08a" font-size="21" font-weight="500">Benchmark on equal terms</text><text x="827" y="524" fill="#a3acad" font-size="17" font-weight="400">Same precision and task accuracy</text><text x="827" y="551" fill="#a3acad" font-size="17" font-weight="400">Same I/O and utilization boundary</text><text x="827" y="578" fill="#a3acad" font-size="17" font-weight="400">No inferred exaFLOP rating</text><path d="M210 452 L210 375" stroke="#8abac8" stroke-width="2" fill="none" stroke-dasharray="6 7" marker-end="url(#blue)"/><path d="M590 452 L770 375" stroke="#8abac8" stroke-width="2" fill="none" stroke-dasharray="6 7" marker-end="url(#blue)"/><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">MZI = Mach–Zehnder interferometer · TIA = transimpedance amplifier · DAC / ADC = data converters.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>