<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">From light to a living-world vision.</title><desc id="desc">Satellite-assisted photosynthesis research · the proposed loop is not a demonstrated capability. In oxygenic photosynthesis, oxygen originates from water. CO₂ conversion alone is a different pathway.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  09</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">From light to a living-world vision.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Satellite-assisted photosynthesis research · the proposed loop is not a demonstrated capability.</text>
    <rect x="45" y="215" width="320" height="200" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 216h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="252" fill="#dac08a" font-size="21" font-weight="500">ORBIT / proposed controller</text><text x="67" y="287" fill="#a3acad" font-size="17" font-weight="400">Photonic workload optimization</text><text x="67" y="314" fill="#a3acad" font-size="17" font-weight="400">Reactor telemetry + scheduling</text><text x="67" y="341" fill="#a3acad" font-size="17" font-weight="400">Candidate tunable optical source</text><text x="67" y="368" fill="#a3acad" font-size="17" font-weight="400">Dedicated beam-power budget</text><rect x="435" y="215" width="320" height="200" rx="10" fill="#111a1e" stroke="#344044"/><path d="M455 216h45" stroke="#8abac8" stroke-width="3"/><text x="457" y="252" fill="#8abac8" font-size="21" font-weight="500">PATH / unvalidated delivery</text><text x="457" y="287" fill="#a3acad" font-size="17" font-weight="400">Pointing + receiver aperture</text><text x="457" y="314" fill="#a3acad" font-size="17" font-weight="400">Dust / atmosphere / visibility</text><text x="457" y="341" fill="#a3acad" font-size="17" font-weight="400">Optical conversion losses</text><text x="457" y="368" fill="#a3acad" font-size="17" font-weight="400">Compare with local illumination</text><rect x="825" y="215" width="330" height="200" rx="10" fill="#111a1e" stroke="#344044"/><path d="M845 216h45" stroke="#91b49b" stroke-width="3"/><text x="847" y="252" fill="#91b49b" font-size="21" font-weight="500">SURFACE / contained reactor</text><text x="847" y="287" fill="#a3acad" font-size="17" font-weight="400">Water + defined reaction pathway</text><text x="847" y="314" fill="#a3acad" font-size="17" font-weight="400">Catalyst or biological system</text><text x="847" y="341" fill="#a3acad" font-size="17" font-weight="400">Oxygen collection + measurement</text><text x="847" y="368" fill="#a3acad" font-size="17" font-weight="400">Feedstock, heat, and power supply</text><path d="M365 312 L435 312" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M755 312 L825 312" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M980 440 L980 498" stroke="#8abac8" stroke-width="2" fill="none"  marker-end="url(#blue)"/><path d="M980 498 L205 498" stroke="#8abac8" stroke-width="2" fill="none"  marker-end="url(#blue)"/><path d="M205 498 L205 440" stroke="#8abac8" stroke-width="2" fill="none"  marker-end="url(#blue)"/><text x="405" y="480" fill="#8abac8" font-size="15" font-weight="400">TELEMETRY / CONTROL FEEDBACK</text><text x="65" y="571" fill="#dac08a" font-size="18" font-weight="400">LONG-TERM VISION: A CONTRIBUTION TO MARS HABITABILITY</text><text x="65" y="609" fill="#a3acad" font-size="17" font-weight="400">Contained oxygen production would be an early milestone; planet-scale terraforming is not demonstrated.</text><text x="65" y="636" fill="#a3acad" font-size="17" font-weight="400">Atmospheric mass, pressure, temperature, losses, and sustained energy remain separate open problems.</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">In oxygenic photosynthesis, oxygen originates from water. CO₂ conversion alone is a different pathway.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>