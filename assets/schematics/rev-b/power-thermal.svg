<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
    <title id="title">Every watt needs a path.</title><desc id="desc">Power and thermal engineering · source heat, electrical output, and useful work are different quantities. RPS = radioisotope power system · flight mass, lifetime, and power are not specified by this sketch.</desc>
    <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#dac08a"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#8abac8"/></marker></defs>
    <rect width="1200" height="760" fill="#0b1115"/><rect width="1200" height="760" fill="url(#grid)"/>
    <g font-family="Arial, Helvetica, sans-serif"><text x="45" y="43" fill="#dac08a" font-size="14" font-weight="600">GOLDSTAR / ORBITAL</text><text x="870" y="43" fill="#a3acad" font-size="13" font-weight="400">CONCEPT STUDY  /  REV B  /  05</text>
    <path d="M45 62H1155" stroke="#344044"/><text x="45" y="112" fill="#f3f1eb" font-size="34" font-weight="500">Every watt needs a path.</text><text x="45" y="147" fill="#a3acad" font-size="17" font-weight="400">Power and thermal engineering · source heat, electrical output, and useful work are different quantities.</text>
    <rect x="45" y="215" width="335" height="180" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 216h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="252" fill="#dac08a" font-size="21" font-weight="500">01 / Source and storage</text><text x="67" y="287" fill="#a3acad" font-size="17" font-weight="400">Solar / RPS trade study</text><text x="67" y="314" fill="#a3acad" font-size="17" font-weight="400">Battery for transient loads</text><text x="67" y="341" fill="#a3acad" font-size="17" font-weight="400">End-of-life power allocation</text><text x="67" y="368" fill="#a3acad" font-size="17" font-weight="400">Conversion efficiency + margin</text><rect x="435" y="215" width="320" height="180" rx="10" fill="#111a1e" stroke="#344044"/><path d="M455 216h45" stroke="#dac08a" stroke-width="3"/><text x="457" y="252" fill="#dac08a" font-size="21" font-weight="500">02 / Electrical loads</text><text x="457" y="287" fill="#a3acad" font-size="17" font-weight="400">Laser + accelerator + memory</text><text x="457" y="314" fill="#a3acad" font-size="17" font-weight="400">Avionics + terminal + ADCS</text><text x="457" y="341" fill="#a3acad" font-size="17" font-weight="400">Heaters and fault recovery</text><text x="457" y="368" fill="#a3acad" font-size="17" font-weight="400">Average and peak load cases</text><rect x="810" y="215" width="345" height="180" rx="10" fill="#111a1e" stroke="#344044"/><path d="M830 216h45" stroke="#dac08a" stroke-width="3"/><text x="832" y="252" fill="#dac08a" font-size="21" font-weight="500">03 / Heat rejection</text><text x="832" y="287" fill="#a3acad" font-size="17" font-weight="400">Conduct heat to a radiator</text><text x="832" y="314" fill="#a3acad" font-size="17" font-weight="400">Include absorbed environmental heat</text><text x="832" y="341" fill="#a3acad" font-size="17" font-weight="400">Isolate any RPS waste heat</text><text x="832" y="368" fill="#a3acad" font-size="17" font-weight="400">Verify hot / cold orbital cases</text><path d="M380 305 L435 305" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><path d="M755 305 L810 305" stroke="#dac08a" stroke-width="2" fill="none"  marker-end="url(#gold)"/><rect x="45" y="450" width="525" height="180" rx="10" fill="#111a1e" stroke="#344044"/><path d="M65 451h45" stroke="#dac08a" stroke-width="3"/><text x="67" y="487" fill="#dac08a" font-size="21" font-weight="500">DECAY IS NOT SERVICE LIFE</text><text x="67" y="522" fill="#a3acad" font-size="17" font-weight="400">Pu-238 heat fraction: 2^(−t / 87.7 years)</text><text x="67" y="549" fill="#a3acad" font-size="17" font-weight="400">At 50 years: about 67% of initial isotope heat</text><text x="67" y="576" fill="#a3acad" font-size="17" font-weight="400">Electrical output also depends on converter aging</text><rect x="625" y="450" width="530" height="180" rx="10" fill="#111a1e" stroke="#344044"/><path d="M645 451h45" stroke="#8abac8" stroke-width="3"/><text x="647" y="487" fill="#8abac8" font-size="21" font-weight="500">FIRST-ORDER RADIATOR CHECK</text><text x="647" y="522" fill="#a3acad" font-size="17" font-weight="400">Q ≈ εσA(T⁴ − Tspace⁴), ideal deep-space view</text><text x="647" y="549" fill="#a3acad" font-size="17" font-weight="400">100 W at 300 K, ε = 0.85 → A ≈ 0.26 m²</text><text x="647" y="576" fill="#a3acad" font-size="17" font-weight="400">Illustration only; absorbed flux and margins omitted</text><path d="M45 686H1155" stroke="#344044"/><text x="45" y="718" fill="#a3acad" font-size="15" font-weight="400">RPS = radioisotope power system · flight mass, lifetime, and power are not specified by this sketch.</text><text x="45" y="745" fill="#dac08a" font-size="11" font-weight="400">NOT TO SCALE · PROPOSED SYSTEM · NO FLIGHT PERFORMANCE IMPLIED</text></g></svg>